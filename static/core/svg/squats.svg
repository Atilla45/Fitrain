<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <style>
    .figure { fill: #4361ee; }
    .outline { fill: none; stroke: #4361ee; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  
  <!-- Figure in squat position -->
  <g class="outline">
    <!-- Head -->
    <circle cx="100" cy="70" r="14"/>
    
    <!-- Arms -->
    <line x1="100" y1="90" x2="70" y2="120"/>
    <line x1="100" y1="90" x2="130" y2="120"/>
    
    <!-- Torso -->
    <line x1="100" y1="90" x2="100" y2="130"/>
    
    <!-- Legs in squat position -->
    <line x1="100" y1="130" x2="70" y2="140"/>
    <line x1="70" y1="140" x2="65" y2="170"/>
    
    <line x1="100" y1="130" x2="130" y2="140"/>
    <line x1="130" y1="140" x2="135" y2="170"/>
  </g>
</svg>