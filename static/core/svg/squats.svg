<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <style>
    .figure { fill: #4361ee; }
    .outline { fill: none; stroke: #4361ee; stroke-width: 2; stroke-linecap: round; }
    .bg { fill: #f0f5ff; }
  </style>
  <circle class="bg" cx="100" cy="100" r="90"/>
  <g>
    <!-- Head -->
    <circle class="figure" cx="100" cy="70" r="15"/>
    
    <!-- Body -->
    <rect class="figure" x="90" y="85" width="20" height="35" rx="5" ry="5"/>
    
    <!-- Arms -->
    <line class="outline" x1="90" y1="95" x2="75" y2="110"/>
    <line class="outline" x1="110" y1="95" x2="125" y2="110"/>
    
    <!-- Legs - Bent in squat position -->
    <line class="outline" x1="95" y1="120" x2="80" y2="140"/>
    <line class="outline" x1="80" y1="140" x2="75" y2="160"/>
    
    <line class="outline" x1="105" y1="120" x2="120" y2="140"/>
    <line class="outline" x1="120" y1="140" x2="125" y2="160"/>
  </g>
</svg>