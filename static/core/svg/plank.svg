<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <style>
    .figure { fill: #4361ee; }
    .outline { fill: none; stroke: #4361ee; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  
  <!-- Figure in plank position -->
  <g class="outline">
    <!-- Head -->
    <circle cx="40" cy="80" r="14"/>
    
    <!-- Arms -->
    <line x1="40" y1="100" x2="60" y2="130"/>
    
    <!-- Elbows to ground -->
    <line x1="60" y1="130" x2="60" y2="160"/>
    
    <!-- Torso straight line -->
    <line x1="60" y1="130" x2="150" y2="130"/>
    
    <!-- Legs -->
    <line x1="150" y1="130" x2="180" y2="160"/>
  </g>
</svg>