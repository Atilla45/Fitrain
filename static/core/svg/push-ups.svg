<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <style>
    .figure { fill: #4361ee; }
    .outline { fill: none; stroke: #4361ee; stroke-width: 2; stroke-linecap: round; }
    .bg { fill: #f0f5ff; }
  </style>
  <circle class="bg" cx="100" cy="100" r="90"/>
  <g>
    <!-- Head -->
    <circle class="figure" cx="60" cy="85" r="15"/>
    
    <!-- Body -->
    <rect class="figure" transform="rotate(-15, 95, 100)" x="70" y="85" width="50" height="20" rx="5" ry="5"/>
    
    <!-- Arms - in push-up position -->
    <line class="outline" x1="70" y1="95" x2="60" y2="125"/>
    <line class="outline" x1="120" y1="95" x2="130" y2="125"/>
    
    <!-- Legs - extended -->
    <line class="outline" x1="120" y1="100" x2="150" y2="90"/>
    <line class="outline" x1="150" y1="90" x2="155" y2="85"/>
  </g>
</svg>