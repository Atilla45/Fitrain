<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <style>
    .figure { fill: #4361ee; }
    .outline { fill: none; stroke: #4361ee; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  
  <!-- Figure in high-knees position -->
  <g class="outline">
    <!-- Head -->
    <circle cx="100" cy="40" r="14"/>
    
    <!-- Arms in running position -->
    <line x1="100" y1="60" x2="80" y2="80"/>
    <line x1="80" y1="80" x2="65" y2="60"/>
    
    <line x1="100" y1="60" x2="120" y2="80"/>
    <line x1="120" y1="80" x2="135" y2="100"/>
    
    <!-- Torso -->
    <line x1="100" y1="60" x2="100" y2="120"/>
    
    <!-- Left leg raised -->
    <line x1="100" y1="120" x2="80" y2="90"/>
    <line x1="80" y1="90" x2="70" y2="110"/>
    
    <!-- Right leg down -->
    <line x1="100" y1="120" x2="110" y2="150"/>
    <line x1="110" y1="150" x2="120" y2="170"/>
  </g>
</svg>