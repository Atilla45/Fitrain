<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <style>
    .figure { fill: #4361ee; }
    .outline { fill: none; stroke: #4361ee; stroke-width: 2; stroke-linecap: round; }
    .bg { fill: #f0f5ff; }
  </style>
  <circle class="bg" cx="100" cy="100" r="90"/>
  <g>
    <!-- Head -->
    <circle class="figure" cx="100" cy="50" r="15"/>
    
    <!-- Body -->
    <rect class="figure" x="90" y="65" width="20" height="45" rx="5" ry="5"/>
    
    <!-- Arms -->
    <line class="outline" x1="90" y1="75" x2="70" y2="85"/>
    <line class="outline" x1="110" y1="75" x2="130" y2="85"/>
    
    <!-- Legs -->
    <line class="outline" x1="95" y1="110" x2="85" y2="150"/>
    <!-- Raised leg -->
    <line class="outline" x1="105" y1="110" x2="110" y2="90"/>
    <line class="outline" x1="110" y1="90" x2="130" y2="100"/>
  </g>
</svg>